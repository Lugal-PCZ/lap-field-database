{% extends "base.html" %}

{% block filters %}
{{ form.as_p }}
{% endblock %}

{% block content %}
<dl>
    <dt style="columns: 250px 2;">
        <div>Locale</div>
        <div>Area</div>
    </dt>
    {% for item in all_items %}
    <dd style="columns: 250px 2;" onclick="window.open('/locale/{{ item.id }}')">
        <div>{{ item.name }}</div>
        <div>{{ item.area }}</div>
    </dd>
    {% endfor %}
</dl>
{% endblock %}
