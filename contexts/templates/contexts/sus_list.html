{% extends "base.html" %}

{% block filters %}
{{ form.as_p }}
{% endblock %}

{% block content %}
<dl>
    <dt style="columns: 4 200px;">
        <div>SU or Locus</div>
        <div>Locale</div>
        <div>Feature Type</div>
        <div>Season(s)</div>
    </dt>
    {% for item in all_items %}
        <dd style="columns: 4 200px;">
            <div><b>{{ item }}</b></div>
            <div>{{ item.locale }}</div>
            <div>{{ item.prefix|default:"-" }}</div>
            <div>{{ item.season_list|join:", " }}</div>
        </dd>
    {% endfor %}
</dl>
{% endblock %}
