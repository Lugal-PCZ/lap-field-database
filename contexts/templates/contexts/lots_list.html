{% extends "base.html" %}

{% block filters %}
{{ form.as_p }}
{% endblock %}

{% block content %}
<dl>
    <dt style="columns: 5 200px;">
        <div>Lot</div>
        <div>SU or Locus</div>
        <div>Locale</div>
        <div>Contents</div>
        <div>Season</div>
    </dt>
    {% for item in all_items %}
    <dd style="columns: 5 200px;">
        <div><b>{{ item }}</b></div>
        <div>{{ item.su }}</div>
        <div>{{ item.su.locale }}</div>
        <div>{{ item.contents|default:"-" }}</div>
        <div>{{ item.season }}</div>
    </dd>
    {% endfor %}
</dl>
{% endblock %}
